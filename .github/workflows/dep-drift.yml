# dep-drift — weekly dependency drift for what native Dependabot can't manage.
#
# Native Dependabot (.github/dependabot.yml) only understands real manifests,
# and this docker-only repo has exactly one: the GitHub Actions in build.yml.
# The other things that can go stale — and that a dependabot run can't touch
# because they aren't a recognised ecosystem — are handled HERE, weekly:
#
#   * CHAMILO_LMS_REF — a raw git ref of chamilo/chamilo-lms fetched by the
#     Dockerfile at build time. We track it against the latest stable release
#     tag of chamilo/chamilo-lms (AGENTS.md: "Prefer a release tag for
#     reproducible public builds" — NOT master, so the image stays reproducible).
#   * docker-compose.yml images — NOT managed here on purpose. mariadb:11 and
#     redis:7 are floating minors; `docker compose pull` already fetches the
#     newest 11.x / 7.x each time, so there is no pin to bump and nothing to
#     detect. (If you ever pin them to patch versions, add them below.)
#   * the PHP base (FROM php:${PHP_VER}-fpm) — deliberately pinned to 8.3 (the
#     point of the takeover branch). A major PHP jump is a human decision, so
#     it is left out of the automation.
#
# WHAT IT OPENS (automatically, weekly):
#   * a PR  — the one-line Dockerfile bump to the newest stable LMS tag, and
#   * an Issue — the weekly drift report.
#
#   The PR is FAIL-CLOSED: before it opens, this workflow builds the image at
#   the candidate ref (the exact build from build.yml, via docker/build-
#   push-action). A PR is opened only if that build succeeds. If it fails, NO
#   PR is opened and the drift Issue records the failure instead — so a large
#   LMS jump (the pin can be many commits behind the latest tag) never lands as
#   a red PR you have to close. It is OPENED, not merged: a maintainer reviews
#   the one-line diff and merges. The PR's own push re-runs build.yml as a
#   second gate.
#
#   The Issue is opened only when there is drift (a PR was opened, or the build
#   gate failed). When the pin already equals the latest stable tag it is a
#   clean no-op — no weekly "all up to date" noise.
#
# All GitHub API calls go through actions/github-script (official `actions`
# org action) — no hand-rolled curl/jq. Git (the one-line Dockerfile edit +
# push) runs inside that same action's `exec`, using GITHUB_TOKEN.
#
# Cost: GitHub-hosted runners are free/unmetered for public repos, so this
# is not metered against the 2,000-min/500 MB quota (private only). The real
# cost is one cold image build per drift week; up-to-date weeks skip the build.
name: dep-drift

on:
  # Mondays 06:00 UTC.
  schedule:
    - cron: "0 6 * * 1"
  # Manual run (same as the schedule: detect latest stable tag, build-gate, open).
  workflow_dispatch:

# GITHUB_TOKEN is read-only by default; grant exactly what this needs. The
# built-in token can push a fresh branch and open a PR on THIS repo (no PAT
# required) because we target the repo the workflow runs in — which is why it
# works in the fork today and would work in upstream if copied there later.
permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  LMS_REPO: chamilo/chamilo-lms
  # PR branch prefix; keep stable for dedup.
  PR_BRANCH_PREFIX: dep-drift/chamilo-lms-

jobs:
  drift:
    name: Detect, build-gate, open
    runs-on: ubuntu-latest
    # A cold LMS build can exceed the default 1h; match build.yml's headroom.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same buildx builder as build.yml so this gate is byte-identical to the
      # real build. Pinned to the same published minor.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # Detect drift: latest stable tag (chamilo/chamilo-lms) vs the current
      # pin, read straight out of the checked-out Dockerfile (no shell grep).
      # actions/github-script is the official `actions`-org action for driving
      # the GitHub REST API from JS — replaces the old curl | jq step.
      - name: Detect drift (latest stable tag vs current pin)
        id: detect
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const lmsRepo = process.env.LMS_REPO;
            // Current pin: the first "ARG CHAMILO_LMS_REF=<value>" in the Dockerfile.
            const df = fs.readFileSync('Dockerfile', 'utf8');
            const m = df.match(/^ARG[ \t]+CHAMILO_LMS_REF=(.+)$/m);
            if (!m) throw new Error('CHAMILO_LMS_REF ARG not found in Dockerfile');
            const CUR = m[1].trim();
            // Latest STABLE release tag. releases/latest 404s if there is no
            // stable release yet — let it fail the run, don't guess.
            const latest = await github.rest.repos.getLatestRelease({ owner: lmsRepo, repo: lmsRepo });
            const LATEST = latest.data.tag_name;
            core.setOutput('CUR', CUR);
            core.setOutput('LATEST', LATEST);
            core.setOutput('DRIFT', CUR === LATEST ? 'false' : 'true');
            console.log(`current pin: ${CUR}`);
            console.log(`latest stable: ${LATEST}`);

      # Up-to-date: nothing to say. No build, no PR, no Issue.
      - name: Up to date — no-op
        if: steps.detect.outputs.DRIFT == 'false'
        run: echo "CHAMILO_LMS_REF already equals the latest stable tag; nothing to open."

      # Build at the candidate ref — the gate. Runs only when there is drift.
      # Identical build to build.yml (same action, same pinning), but with the
      # candidate ref as a build-arg. A failure here means NO PR is opened.
      #
      # NOTE: the gate conditions use `steps.gate.result` — the standard
      # Actions step-status context (success/failure/cancelled/skipped),
      # reflecting the build step's own run (`.result` is the current
      # spelling; `.outcome` is the legacy alias). When DRIFT=false the gate
      # is skipped, so result=='skipped' and neither downstream step runs.
      - name: Build-gate at candidate ref
        if: steps.detect.outputs.DRIFT == 'true'
        id: gate
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          build-args: |
            CHAMILO_LMS_REF=${{ steps.detect.outputs.LATEST }}
          tags: dep-drift-gate:${{ steps.detect.outputs.LATEST }}

      # Build failed: NO PR. Record it as the drift Issue instead (dedup by ref).
      - name: Record build-gate failure (no PR opened)
        if: steps.detect.outputs.DRIFT == 'true' && steps.gate.result == 'failure'
        env:
          LATEST: ${{ steps.detect.outputs.LATEST }}
        uses: actions/github-script@v9
        with:
          script: |
            const lmsRepo = process.env.LMS_REPO;
            const LATEST = process.env.LATEST;
            const TITLE = `chamilo-lms drift (build FAILED) ${LATEST}`;
            // Dedup: an open Issue already records this failure for this ref?
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open',
            });
            const dup = issues.data.find((i) => i.title === TITLE);
            if (dup) {
              console.log(`A failure Issue for ${LATEST} already exists (#${dup.number}); not duplicating.`);
              process.exit(0);
            }
            const body = `The weekly dep-drift build-gate failed building the image at CHAMILO_LMS_REF=${LATEST},\n` +
              'so NO bump PR was opened (fail-closed). The current pin remains unchanged.\n' +
              'See the dep-drift workflow run for the build log. Once the build passes at this\n' +
              'ref, re-run the workflow to open the PR.';
            const created = await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title: TITLE, body,
            });
            console.log(`Opened failure Issue #${created.data.number}`);

      # Build succeeded: open the one-line bump PR (dedup by branch), then file
      # the weekly drift report Issue (dedup by from->to pair).
      - name: Open bump PR + file drift Issue
        if: steps.detect.outputs.DRIFT == 'true' && steps.gate.result == 'success'
        env:
          CUR: ${{ steps.detect.outputs.CUR }}
          LATEST: ${{ steps.detect.outputs.LATEST }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const CUR = process.env.CUR;
            const LATEST = process.env.LATEST;
            const lmsRepo = process.env.LMS_REPO;
            const prefix = process.env.PR_BRANCH_PREFIX;
            const token = process.env.GITHUB_TOKEN;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const BRANCH = `${prefix}${LATEST}`;
            const gitIdName = 'github-actions[bot]';
            const gitIdEmail = '41898282+github-actions[bot]@users.noreply.github.com';
            // Default branch of THIS repo (self-addressing: fork master today,
            // upstream master if this workflow is copied there later).
            const { data: repoInfo } = await github.rest.repos.get({ owner, repo });
            const DEFAULT_BRANCH = repoInfo.default_branch;

            // Dedup: an open PR already targets this ref?
            const existingPrs = await github.rest.pulls.list({ owner, repo, state: 'open', head: BRANCH });
            let NO_PR = existingPrs.data.length > 0;
            if (NO_PR) {
              console.log(`An open PR for ${BRANCH} already exists (#${existingPrs.data[0].number}); skipping the PR.`);
            }

            if (!NO_PR) {
              // exec.exec RESOLVES with the exit code — it does not throw on a
              // non-zero exit — so wrap it: a failed `git push` must fail this
              // step, not open a PR pointing at a branch that never got pushed.
              const run = async (cmd, args) => {
                const code = await exec.exec(cmd, args);
                if (code != null && code !== 0) throw new Error(`${cmd} ${args.join(' ')} failed (exit ${code})`);
              };
              // One-line Dockerfile edit + push via the action's git. exec.exec
              // runs the command with an ARGS ARRAY (no shell), so the tag and
              // repo values pass through verbatim — nothing to shell-quote.
              await run('git', ['checkout', '-b', BRANCH]);
              const df = fs.readFileSync('Dockerfile', 'utf8');
              if (!/^ARG[ \t]+CHAMILO_LMS_REF=.*$/m.test(df)) throw new Error('CHAMILO_LMS_REF ARG not found in Dockerfile');
              fs.writeFileSync('Dockerfile', df.replace(/^ARG[ \t]+CHAMILO_LMS_REF=.*$/m, `ARG CHAMILO_LMS_REF=${LATEST}`));
              await run('git', ['add', 'Dockerfile']);
              await run('git', [
                '-c', `user.name=${gitIdName}`,
                '-c', `user.email=${gitIdEmail}`,
                'commit',
                '-m', `build: bump CHAMILO_LMS_REF to ${LATEST}`,
                '-m', `Bumps the pinned ${lmsRepo} ref from ${CUR} to the latest stable release ${LATEST} (one-line, fail-closed: this run built the image at ${LATEST} before opening).`,
              ]);
              // Push with GITHUB_TOKEN (we hold contents:write, so a fresh-branch
              // push to THIS repo is allowed — no PAT needed).
              await run('git', ['remote', 'set-url', 'origin', `https://x-access-token:${token}@github.com/${owner}/${repo}.git`]);
              await run('git', ['push', '-u', 'origin', BRANCH]);
            }

            // File the weekly drift report Issue (dedup by from->to).
            const TITLE = `chamilo-lms drift ${CUR} -> ${LATEST}`;
            const issues = await github.rest.issues.listForRepo({ owner, repo, state: 'open' });
            const dup = issues.data.find((i) => i.title === TITLE);
            if (dup) {
              console.log(`A drift Issue for this pair already exists (#${dup.number}); not duplicating.`);
              process.exit(0);
            }
            // How many commits the latest tag is ahead of the pin (best-effort).
            let AHEAD = '?';
            try {
              const cmp = await github.rest.repos.compareCommits({ owner: lmsRepo, repo: lmsRepo, baseCommit: CUR, headCommit: LATEST });
              AHEAD = cmp.data.ahead_by;
            } catch (e) { AHEAD = '?'; }
            const body = `Weekly dep-drift report.\n` +
              `- Current pin: ${CUR}\n` +
              `- Latest stable: ${LATEST} (${AHEAD} commits ahead of the pin)\n` +
              `- Outcome: build-gate PASSED at ${LATEST}; a bump PR was opened (or already open).\n` +
              'This Issue is the weekly report; the actual change is the linked PR (one-line\n' +
              'Dockerfile diff). Opened automatically by the dep-drift workflow; not auto-merged.';
            const createdIssue = await github.rest.issues.create({ owner, repo, title: TITLE, body });

            // Open the PR (REST: self-addresses the repo; no gh binary to pin).
            if (!NO_PR) {
              const prBody = `Bumps the pinned CHAMILO_LMS_REF from ${CUR} to the latest stable release ${LATEST}.\n` +
                'This PR was opened automatically by the weekly dep-drift workflow, which built\n' +
                `the image at ${LATEST} before opening it (fail-closed). The push re-runs the build\n` +
                'job as a second gate. Review the one-line diff and merge; no auto-merge.';
              const createdPr = await github.rest.pulls.create({
                owner, repo, title: `build: bump CHAMILO_LMS_REF to ${LATEST}`,
                head: BRANCH, base: DEFAULT_BRANCH, body: prBody,
              });
              console.log(`Opened PR #${createdPr.data.number}`);
            }
