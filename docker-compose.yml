# Chamilo LMS — compose.
#
#   chamilo : the app (PHP 8.3-FPM + nginx, this repo's image) — HTTP on :80
#   db      : MariaDB (LMS database)
#   redis   : session/cache (optional, mapped to 6379)
#
# The app reads DATABASE_* (see .env.dist), NOT DB_*. Values below are
# defaults for a local dev bring-up; override for production.
services:
  chamilo:
    build: .
    ports:
      - "80:80"
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=3306
      - DATABASE_NAME=chamilo
      - DATABASE_USER=chamilo
      - DATABASE_PASSWORD=chamilo
      - APP_ENV=prod
      - APP_SECRET=changeme-32-chars-min-aaaaaaaa
    depends_on:
      - db
      - redis
    volumes:
      - chamilo_data:/app/chamilo-lms/var
    restart: unless-stopped

  db:
    image: mariadb:11
    environment:
      - MARIADB_ROOT_PASSWORD=chamilo
      - MARIADB_DATABASE=chamilo
      - MARIADB_USER=chamilo
      - MARIADB_PASSWORD=chamilo
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  chamilo_data:
  db_data:
  redis_data:
